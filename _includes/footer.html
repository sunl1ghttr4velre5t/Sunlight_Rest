<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-line">
      <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span>{{ site.title }}</span>
    </p>
    <p class="footer-note">{{ site.tagline }}</p>
  </div>
</footer>
