<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" focusable="false">
          <defs>
            <linearGradient id="brand-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9ccbff" />
              <stop offset="1" stop-color="#e8f2ff" />
            </linearGradient>
            <linearGradient id="brand-sun" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd97a" />
              <stop offset="1" stop-color="#f59e0b" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="15" fill="url(#brand-sky)" />
          <circle cx="32" cy="26" r="10" fill="url(#brand-sun)" />
          <path d="M0 44c10-6 21-6 32 0s21 6 32 0v20H0z" fill="#3b82f6" opacity=".5" />
          <path d="M0 51c10-5 21-5 32 0s21 5 32 0v13H0z" fill="#2563eb" opacity=".72" />
        </svg>
      </span>
      <span class="brand-title">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      {% for item in site.nav %}
        {% if page.url == item.url %}
          <a class="nav-link is-active" href="{{ item.url | relative_url }}" aria-current="page">{{ item.title }}</a>
        {% else %}
          <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endif %}
      {% endfor %}
    </nav>
  </div>
</header>
