---
layout: default
---

<div class="wrap">
  <div class="sheet page">
    {% if page.title %}
    <header class="page-header">
      <h1 class="page-heading">{{ page.title }}</h1>
      {% if page.description %}<p class="page-desc">{{ page.description }}</p>{% endif %}
    </header>
    {% endif %}

    <div class="post-content">
      {{ content }}
    </div>
  </div>
</div>
