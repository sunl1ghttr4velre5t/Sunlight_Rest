<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>

  <style>
    /* 独立背景层，固定在底层，不拦截点击 */
    .site-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;                /* 放在内容下面 */
      background-image: url('{{ site.baseurl }}/assets/images/Blue_Sky.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      pointer-events: none;       /* 防止挡住链接点击 */
    }

    /* 确保 body 没有不透明背景色遮住背景图 */
    body {
      background: transparent;
    }

    /* 如果用了 z-index: -1 还是被盖，就启用下面这行给内容提层 */
    /*
    .page-content, .post-content, main, .wrapper {
      position: relative;
      z-index: 1;
    }
    */
  </style>
</head>
<body>
  <!-- 背景层放在 body 最前面 -->
  <div class="site-background"></div>

  <!-- 你原有的页面内容，比如 header、{{ content }} 等 -->
  {% include header.html %}
  <main class="page-content">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
